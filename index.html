<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Arena Neon - Multi-joueurs</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; background-color: #0d0e15; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden; touch-action: none;
        }
        .menu-container {
            text-align: center; background: #131722; padding: 30px; border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); border: 1px solid #00f2fe; width: 350px; max-width: 90%;
        }
        .connection-box { margin-bottom: 15px; padding: 15px; background: #1c2030; border-radius: 8px; border: 1px solid #2c3248; }
        input { padding: 12px; font-size: 1rem; width: 100%; border: 1px solid #2c3248; border-radius: 8px; background: #0d0e15; color: white; text-align: center; margin-bottom: 10px; }
        input:focus { border-color: #00f2fe; outline: none; }
        button { padding: 12px 24px; font-size: 1rem; background: linear-gradient(45deg, #00f2fe, #4facfe); color: #0d0e15; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        #game-zone { display: none; width: 100%; max-width: 800px; padding: 10px; position: relative; }
        #ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: rgba(13, 23, 34, 0.8); padding: 10px; border-radius: 8px; border: 1px solid #2c3248; }
        .hp-bar-container { width: 120px; background-color: #1c2030; border-radius: 20px; overflow: hidden; border: 1px solid #4a5568; height: 14px; margin-top: 4px; }
        .hp-bar { height: 100%; width: 100%; transition: width 0.2s; }
        #hp-p1 { background: linear-gradient(90deg, #00f2fe, #4facfe); box-shadow: 0 0 8px #00f2fe; }
        #hp-p2 { background: linear-gradient(90deg, #ff0844, #ffb199); box-shadow: 0 0 8px #ff0844; }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #090a0f; border-radius: 12px; border: 2px solid #2c3248; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #mobile-controls { display: none; position: absolute; bottom: 20px; left: 0; width: 100%; padding: 0 30px; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
        .joystick-zone { width: 100px; height: 100px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; pointer-events: auto; }
        .joystick-stick { width: 40px; height: 40px; background: rgba(0, 242, 254, 0.6); border: 2px solid #00f2fe; border-radius: 50%; position: absolute; top: 28px; left: 28px; box-shadow: 0 0 10px #00f2fe; }
        .action-buttons { display: flex; gap: 15px; pointer-events: auto; }
        .action-btn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid; color: white; font-weight: bold; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; background: rgba(19, 23, 34, 0.8); }
        #btn-shoot { border-color: #00f2fe; } #btn-dash { border-color: #ffb199; }
        .winner-screen { display: none; position: absolute; background: rgba(13, 14, 21, 0.95); top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .winner-text { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="setup-zone" class="menu-container">
        <h1>CYBER ARENA NEON 🌐</h1>
        <div class="connection-box">
            <p style="margin:0 0 10px 0; font-size:0.9rem; color:#a0aec0;">Étape 1 : Partage ton code</p>
            <h2 id="my-id" style="color:#00f2fe; margin:0; font-family:monospace;">Génération...</h2>
        </div>
        <div class="connection-box">
            <p style="margin:0 0 10px 0; font-size:0.9rem; color:#a0aec0;">Étape 2 : Ou rejoint ton ami</p>
            <input type="text" id="friend-id-input" placeholder="Coller le code ici">
            <button onclick="connectToFriend()">COMBATTRE</button>
        </div>
    </div>

    <div id="game-zone">
        <div id="ui">
            <div>
                <div id="name-p1" style="font-size:0.8rem; color:#00f2fe;">Bleu</div>
                <div class="hp-bar-container"><div id="hp-p1" class="hp-bar"></div></div>
            </div>
            <div id="role-indicator">Connexion...</div>
            <div>
                <div id="name-p2" style="font-size:0.8rem; color:#ff0844; text-align:right;">Rouge</div>
                <div class="hp-bar-container"><div id="hp-p2" class="hp-bar"></div></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
            <div class="winner-screen" id="winnerScreen">
                <div class="winner-text" id="winnerText">Gagné !</div>
                <button onclick="location.reload()" style="width:auto;">Rejouer</button>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="joystick-zone" id="joyZone"><div class="joystick-stick" id="joyStick"></div></div>
            <div class="action-buttons">
                <div class="action-btn" id="btn-dash">DASH</div>
                <div class="action-btn" id="btn-shoot">FEU</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let peer = new Peer(), conn = null, isHost = false;
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').style.display = 'flex';
        }

        const obstacles = [
            { x: 180, y: 100, w: 30, h: 250, color: '#bd10e0' },
            { x: 590, y: 100, w: 30, h: 250, color: '#bd10e0' },
            { x: 340, y: 195, w: 120, h: 60, color: '#bd10e0' }
        ];

        let p1 = { x: 100, y: 225, size: 18, color: '#00f2fe', dx: 1, dy: 0, hp: 100, dashing: 0 };
        let p2 = { x: 700, y: 225, size: 18, color: '#ff0844', dx: -1, dy: 0, hp: 100, dashing: 0 };
        let localPlayer, remotePlayer, bullets = [], items = [], particles = [], gameOver = false, lastShot = 0, lastDash = 0;
        const shotCooldown = 250, dashCooldown = 1500;

        let joyActive = false, joyStart = { x: 0, y: 0 }, joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), maxRadius = 35;

        joyZone.addEventListener('touchstart', e => {
            joyActive = true; const rect = joyZone.getBoundingClientRect();
            joyStart = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        });
        window.addEventListener('touchmove', e => {
            if (!joyActive) return;
            const touch = Array.from(e.touches).find(t => t.target === joyZone || joyZone.contains(t.target));
            if (!touch) return;
            let distX = touch.clientX - joyStart.x, distY = touch.clientY - joyStart.y;
            let distance = Math.hypot(distX, distY);
            if (distance > maxRadius) { distX = (distX / distance) * maxRadius; distY = (distY / distance) * maxRadius; distance = maxRadius; }
            joyStick.style.transform = `translate(${distX}px, ${distY}px)`;
            if (distance > 10) { localPlayer.dx = distX / distance; localPlayer.dy = distY / distance; localPlayer.isMovingTouch = true; }
        });
        window.addEventListener('touchend', () => { joyActive = false; joyStick.style.transform = 'translate(0px, 0px)'; if(localPlayer) localPlayer.isMovingTouch = false; });

        document.getElementById('btn-shoot').addEventListener('touchstart', () => { window.isActionShooting = true; });
        document.getElementById('btn-shoot').addEventListener('touchend', () => { window.isActionShooting = false; });
        document.getElementById('btn-dash').addEventListener('touchstart', () => { triggerDash(); });

        peer.on('open', id => document.getElementById('my-id').innerText = id);
        peer.on('connection', connection => { conn = connection; isHost = true; localPlayer = p1; remotePlayer = p2; setupGame(); });
        
        function connectToFriend() {
            const fId = document.getElementById('friend-id-input').value.trim(); if(!fId) return;
            conn = peer.connect(fId); isHost = false; localPlayer = p2; remotePlayer = p1;
            conn.on('open', setupGame);
        }

        function setupGame() {
            document.getElementById('setup-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('role-indicator').innerHTML = isHost ? "<span style='color:#00f2fe'>BLEU</span>" : "<span style='color:#ff0844'>ROUGE</span>";
            if(isHost) { document.getElementById('name-p1').innerText = "Bleu (Toi)"; } else { document.getElementById('name-p2').innerText = "Rouge (Toi)"; }
            
            conn.on('data', data => {
                if (data.type === 'SYNC') {
                    remotePlayer.x = data.x; remotePlayer.y = data.y; remotePlayer.dx = data.dx; remotePlayer.dy = data.dy; remotePlayer.hp = data.hp; remotePlayer.dashing = data.dashing; updateHPBars();
                } else if (data.type === 'SHOOT') {
                    bullets.push({ x: data.x, y: data.y, vx: data.vx, vy: data.vy, color: data.color, owner: 'remote' });
                } else if (data.type === 'ITEM') { items = data.items; }
                else if (data.type === 'HIT') { createParticles(data.x, data.y, data.color); }
            });

            if (isHost) {
                setInterval(() => {
                    if (gameOver || items.length >= 1) return;
                    let rx = Math.random() * 700 + 50, ry = Math.random() * 350 + 50;
                    if (!checkObstacleCollision(rx, ry, 15)) { items.push({ x: rx, y: ry }); conn.send({ type: 'ITEM', items: items }); }
                }, 6000);
            }
            gameLoop();
        }

        function checkObstacleCollision(x, y, size) {
            for (let obs of obstacles) { if (x + size > obs.x && x - size < obs.x + obs.w && y + size > obs.y && y - size < obs.y + obs.h) return true; }
            return false;
        }

        function triggerDash() {
            const now = Date.now();
            if (now - lastDash > dashCooldown && !localPlayer.dashing) { localPlayer.dashing = 10; lastDash = now; }
        }

        function updateLocalPlayer() {
            let mx = 0, my = 0, currentSpeed = 3.5;
            if (localPlayer.dashing > 0) { currentSpeed = 9; localPlayer.dashing--; }
            if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) my = -1;
            if (keys['KeyS'] || keys['ArrowDown']) my = 1;
            if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) mx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
            if (keys['ShiftLeft'] || keys['ShiftRight']) triggerDash();

            if (mx !== 0 || my !== 0) { localPlayer.dx = mx; localPlayer.dy = my; localPlayer.isMovingTouch = false; }
            let fx = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dx : mx;
            let fy = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dy : my;

            localPlayer.x += fx * currentSpeed;
            if (localPlayer.x - localPlayer.size < 0 || localPlayer.x + localPlayer.size > canvas.width || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.x -= fx * currentSpeed;
            localPlayer.y += fy * currentSpeed;
            if (localPlayer.y - localPlayer.size < 0 || localPlayer.y + localPlayer.size > canvas.height || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.y -= fy * currentSpeed;

            if (keys['Space'] || keys['Enter'] || window.isActionShooting) {
                const now = Date.now();
                if (now - lastShot > shotCooldown) {
                    let bData = { x: localPlayer.x, y: localPlayer.y, vx: localPlayer.dx * 8, vy: localPlayer.dy * 8, color: localPlayer.color };
                    bullets.push({ ...bData, owner: 'local' }); lastShot = now; conn.send({ type: 'SHOOT', ...bData });
                }
            }
            conn.send({ type: 'SYNC', x: localPlayer.x, y: localPlayer.y, dx: localPlayer.dx, dy: localPlayer.dy, hp: localPlayer.hp, dashing: localPlayer.dashing });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, r: Math.random()*2+1, alpha: 1, color: color });
        }

        function update() {
            if (gameOver) return; updateLocalPlayer();
            particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; if(p.alpha <= 0) particles.splice(idx, 1); });

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkObstacleCollision(b.x, b.y, 4)) { bullets.splice(i, 1); continue; }
                if (b.owner === 'remote' && Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) < localPlayer.size) {
                    localPlayer.hp -= 8; createParticles(b.x, b.y, localPlayer.color);
                    conn.send({ type: 'HIT', x: b.x, y: b.y, color: localPlayer.color }); bullets.splice(i, 1); updateHPBars();
                    if (localPlayer.hp <= 0) endGame("Défaite... 💀");
                }
            }
            for (let i = items.length - 1; i >= 0; i--) {
                if (Math.hypot(localPlayer.x - items[i].x, localPlayer.y - items[i].y) < localPlayer.size + 10) {
                    localPlayer.hp = Math.min(100, localPlayer.hp + 20); updateHPBars(); items.splice(i, 1);
                    if(isHost) conn.send({ type: 'ITEM', items: items });
                }
            }
            if (remotePlayer.hp <= 0) endGame("Victoire ! 🏆");
        }

        function updateHPBars() {
            document.getElementById('hp-p1').style.width = Math.max(0, p1.hp) + '%';
            document.getElementById('hp-p2').style.width = Math.max(0, p2.hp) + '%';
        }

        function draw() {
            ctx.fillStyle = '#090a0f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)'; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            obstacles.forEach(obs => {
                ctx.shadowBlur = 12; ctx.shadowColor = obs.color; ctx.fillStyle = 'rgba(189, 16, 224, 0.15)'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = obs.color; ctx.lineWidth = 2; ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });
            ctx.shadowBlur = 0;
            items.forEach(item => { ctx.shadowBlur = 10; ctx.shadowColor = '#39ff14'; ctx.fillStyle = '#39ff14'; ctx.beginPath(); ctx.arc(item.x, item.y, 6, 0, Math.PI*2); ctx.fill(); });
            ctx.shadowBlur = 0;
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill(); });
            particles.forEach(p => { ctx.fillStyle = `rgba(${p.color === '#00f2fe' ? '0,242,254' : '255,8,68'}, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });

            drawPlayer(p1); drawPlayer(p2);
        }

        function drawPlayer(p) {
            if (p.hp <= 0) return;
            ctx.shadowBlur = p.dashing > 0 ? 20 : 10; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.dx * 24, p.y + p.dy * 24); ctx.stroke();
        }

        function endGame(text) { gameOver = true; document.getElementById('winnerText').innerText = text; document.getElementById('winnerScreen').style.display = 'flex'; }
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    </script>
</body>
</html>
