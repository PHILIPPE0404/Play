<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixel Arena Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; image-rendering: pixelated; }
        
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden !important; position: fixed; top: 0; left: 0;
            font-family: 'Press Start 2P', monospace; background-color: #0b0b10; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; -webkit-overflow-scrolling: none;
        }

        /* --- SUPER MENU PRINCIPAL MULTI-ONGLETS --- */
        .menu-container {
            background: #181824; padding: 15px; border: 6px solid #fff; box-shadow: 6px 6px 0 #000;
            width: 420px; max-width: 95%; z-index: 10; max-height: 95vh; display: flex; flex-direction: column;
        }
        h1 { margin: 0 0 10px 0; color: #3871e0; font-size: 0.8rem; text-align: center; text-shadow: 2px 2px 0 #000; }
        
        /* Onglets */
        .menu-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 8px 2px; font-size: 0.45rem; background: #242436; border: 3px solid #4d4d6a;
            color: #aaa; cursor: pointer; font-family: 'Press Start 2P', monospace; font-weight: bold;
        }
        .tab-btn.active { border-color: #3871e0; background: #3871e0; color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .box { margin-bottom: 10px; padding: 10px; background: #242436; border: 4px solid #4d4d6a; text-align: center; }
        p { font-size: 0.45rem; margin: 3px 0; color: #ccc; line-height: 1.4; }
        
        /* Onglet 1 : Profil & Skin */
        .class-select { display: flex; gap: 4px; margin-top: 8px; }
        .class-btn { flex: 1; padding: 6px 2px; font-size: 0.4rem; background: #14141f; border: 2px solid #4d4d6a; color: #fff; font-family: 'Press Start 2P', monospace; cursor: pointer; }
        .class-btn.active { border-color: #27ae60; background: #1b3d25; }
        #skin-preview-canvas { background: #0b0b10; border: 3px solid #fff; margin-top: 8px; display: block; margin-left: auto; margin-right: auto; }

        /* Onglet 2 : Lobbies */
        .lobby-list { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
        .lobby-row {
            display: flex; justify-content: space-between; align-items: center; padding: 6px;
            background: #14141f; border: 2px solid #4d4d6a; font-size: 0.5rem; cursor: pointer;
        }
        .lobby-row:hover, .lobby-row.selected { border-color: #3871e0; background: #1c273d; }
        .lobby-status { font-size: 0.4rem; color: #27ae60; }
        
        .lobby-action-zone { margin-top: 10px; border-top: 2px dashed #4d4d6a; padding-top: 8px; display: none; }
        input {
            padding: 6px; font-size: 0.55rem; width: 100%; border: 3px solid #4d4d6a;
            background: #0b0b10; color: white; text-align: center; margin-bottom: 6px; font-family: 'Press Start 2P', monospace;
        }
        .btn-side { display: flex; gap: 5px; }

        /* Onglet 3 : Paramètres Touches */
        .key-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 0.45rem; background: #14141f; padding: 5px; border: 2px solid #4d4d6a; }
        .key-bind-btn { background: #3871e0; border: 2px solid #fff; color: white; padding: 4px 8px; font-size: 0.4rem; font-family: 'Press Start 2P', monospace; cursor: pointer; min-width: 90px; text-align: center; }

        /* Boutons Génériques */
        .main-btn {
            padding: 8px; font-size: 0.55rem; background: #3871e0; color: #fff;
            border: 3px solid #fff; box-shadow: 3px 3px 0 #000; cursor: pointer;
            font-family: 'Press Start 2P', monospace; width: 100%; font-weight: bold;
        }
        .main-btn:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 #000; }

        /* --- HUD JEU --- */
        #game-zone { display: none; width: 100vw; height: 100vh; max-width: 850px; max-height: 580px; padding: 5px; position: relative; }
        #ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; background: #181824; padding: 6px; border: 4px solid #fff; }
        .hp-container { display: flex; flex-direction: column; gap: 2px; width: 130px; }
        .bar-border { width: 100%; background-color: #4d4d6a; border: 2px solid #000; height: 12px; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s; }
        .local-hp { background: #3871e0; }
        .remote-hp { background: #e03838; }
        .shield-fill { background: #f1c40f; width: 0%; }
        .ulti-border { height: 8px; background: #222; border: 1px solid #000; width: 100%; }
        .ulti-fill { background: #9b59b6; height: 100%; width: 0%; }
        #role-indicator { font-size: 0.45rem; color: #f4b41b; text-align: center; }

        .canvas-container { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 6px solid #fff; box-shadow: 4px 4px 0 #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Commandes Mobiles */
        #mobile-controls { display: none; position: absolute; bottom: 10px; left: 0; width: 100%; padding: 0 15px; justify-content: space-between; align-items: center; pointer-events: none; z-index: 15; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(0,0,0,0.5); border: 4px solid rgba(255,255,255,0.4); position: relative; pointer-events: auto; }
        .joystick-stick { width: 30px; height: 30px; background: #3871e0; border: 3px solid #fff; position: absolute; top: 21px; left: 21px; }
        .action-buttons { display: flex; gap: 6px; pointer-events: auto; align-items: center; }
        .action-btn { width: 46px; height: 46px; border: 4px solid #fff; color: white; font-size: 0.4rem; display: flex; align-items: center; justify-content: center; background: #181824; box-shadow: 2px 2px 0 #000; font-weight: bold; }
        #btn-shoot { background: #3871e0; width: 52px; height: 52px; } 
        #btn-dash { background: #e0a938; }
        #btn-ulti { background: #9b59b6; }

        .winner-screen { display: none; position: absolute; background: rgba(11, 11, 16, 0.95); top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        .winner-text { font-size: 0.9rem; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="setup-zone" class="menu-container">
        <h1>PIXEL ARENA MULTI 🌐</h1>
        
        <div class="menu-tabs">
            <button id="t-profil" class="tab-btn active" onclick="switchTab('profil')">👤 PERSO</button>
            <button id="t-lobbies" class="tab-btn" onclick="switchTab('lobbies')">⚔️ SALONS</button>
            <button id="t-touches" class="tab-btn" onclick="switchTab('touches')">⚙️ TOUCHES</button>
        </div>

        <div id="content-profil" class="tab-content active">
            <div class="box">
                <p style="color:#f1c40f; font-weight:bold;">SÉLECTIONNE TON COMBATTANT :</p>
                <div class="class-select">
                    <button class="class-btn active" id="cb-0" onclick="selectClass(0)">GUERRIER</button>
                    <button class="class-btn" id="cb-1" onclick="selectClass(1)">SNIPER</button>
                    <button class="class-btn" id="cb-2" onclick="selectClass(2)">TANK</button>
                </div>
                <canvas id="skin-preview-canvas" width="80" height="80"></canvas>
                <p id="class-desc" style="margin-top:6px; font-size:0.38rem; color:#aaa;"></p>
            </div>
            <button class="main-btn" onclick="switchTab('lobbies')">SUIVANT : TROUVER UN SALON</button>
        </div>

        <div id="content-lobbies" class="tab-content">
            <div class="box">
                <p style="color:#3871e0;">CHOISIS UN SALON DE COMBAT :</p>
                <div class="lobby-list">
                    <div class="lobby-row" id="lr-1" onclick="chooseLobbySlot(1)"><span>SALON 01</span><span class="lobby-status">DISPO</span></div>
                    <div class="lobby-row" id="lr-2" onclick="chooseLobbySlot(2)"><span>SALON 02</span><span class="lobby-status">DISPO</span></div>
                    <div class="lobby-row" id="lr-3" onclick="chooseLobbySlot(3)"><span>SALON 03</span><span class="lobby-status">DISPO</span></div>
                    <div class="lobby-row" id="lr-4" onclick="chooseLobbySlot(4)"><span>SALON 04</span><span class="lobby-status">DISPO</span></div>
                    <div class="lobby-row" id="lr-5" onclick="chooseLobbySlot(5)"><span>SALON 05</span><span class="lobby-status">DISPO</span></div>
                </div>

                <div id="lobby-action-zone" class="lobby-action-zone">
                    <p style="color:#fff; margin-bottom:5px;" id="lobby-title-action">SALON SELECTIONNÉ</p>
                    <input type="text" id="secret-code-input" placeholder="CODE SECRET (EX: 9999)">
                    <div class="btn-side">
                        <button class="main-btn" style="background:#27ae60;" onclick="initLobbyAction(true)">CRÉER</button>
                        <button class="main-btn" style="background:#3871e0;" onclick="initLobbyAction(false)">REJOINDRE</button>
                    </div>
                </div>
            </div>
            <p id="status-text" style="color:#e03838; font-size:0.4rem; text-align:center;"></p>
        </div>

        <div id="content-touches" class="tab-content">
            <div class="box" style="text-align:left;">
                <p style="color:#3871e0; text-align:center; margin-bottom:8px;">CLIQUE ET ENFONCE UNE TOUCHE :</p>
                <div class="key-row"><span>AVANCER :</span><button class="key-bind-btn" id="kb-UP" onclick="listenNewKey('UP')">Z</button></div>
                <div class="key-row"><span>RECULER :</span><button class="key-bind-btn" id="kb-DOWN" onclick="listenNewKey('DOWN')">S</button></div>
                <div class="key-row"><span>GAUCHE :</span><button class="key-bind-btn" id="kb-LEFT" onclick="listenNewKey('LEFT')">Q</button></div>
                <div class="key-row"><span>DROITE :</span><button class="key-bind-btn" id="kb-RIGHT" onclick="listenNewKey('RIGHT')">D</button></div>
                <div class="key-row"><span>TIRER :</span><button class="key-bind-btn" id="kb-SHOOT" onclick="listenNewKey('SHOOT')">Space</button></div>
                <div class="key-row"><span>DASH :</span><button class="key-bind-btn" id="kb-DASH" onclick="listenNewKey('DASH')">ShiftLeft</button></div>
                <div class="key-row"><span>ULTI :</span><button class="key-bind-btn" id="kb-ULTI" onclick="listenNewKey('ULTI')">E</button></div>
            </div>
            <button class="main-btn" onclick="switchTab('profil')">RETOURNER AU PROFIL</button>
        </div>
    </div>

    <div id="game-zone">
        <div id="ui">
            <div class="hp-container">
                <div id="local-title" style="font-size:0.4rem; color:#3871e0;">TOI</div>
                <div class="bar-border"><div id="hp-local" class="bar-fill local-hp"></div></div>
                <div class="bar-border" style="height:6px; margin-top:-2px;"><div id="shield-local" class="bar-fill shield-fill"></div></div>
                <div class="ulti-border"><div id="ulti-local" class="ulti-fill"></div></div>
            </div>
            <div id="role-indicator">MAP...</div>
            <div class="hp-container" style="align-items: flex-end;">
                <div id="remote-title" style="font-size:0.4rem; color:#e03838;">ENNEMI</div>
                <div class="bar-border"><div id="hp-remote" class="bar-fill remote-hp"></div></div>
                <div class="bar-border" style="height:6px; margin-top:-2px;"><div id="shield-remote" class="bar-fill shield-fill"></div></div>
                <div class="ulti-border"><div id="ulti-remote" class="ulti-fill"></div></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
            <div class="winner-screen" id="winnerScreen">
                <div class="winner-text" id="winnerText">FIN</div>
                <button class="main-btn" onclick="location.reload()" style="width:auto; padding: 8px 16px;">QUITTER LE SALON</button>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="joystick-zone" id="joyZone"><div class="joystick-stick" id="joyStick"></div></div>
            <div class="action-buttons">
                <div class="action-btn" id="btn-dash">DASH</div>
                <div class="action-btn" id="btn-ulti">ULTI</div>
                <div class="action-btn" id="btn-shoot">FEU</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let peer = null, conn = null, isHost = false;
        const keys = {};

        // --- CLAVIER CONFIGURABLE ---
        let userKeys = { UP: 'KeyW', DOWN: 'KeyS', LEFT: 'KeyA', RIGHT: 'KeyD', SHOOT: 'Space', DASH: 'ShiftLeft', ULTI: 'KeyE' };
        let activeKeyToBind = null;

        window.addEventListener('keydown', e => {
            if (activeKeyToBind) {
                userKeys[activeKeyToBind] = e.code;
                document.getElementById('kb-' + activeKeyToBind).innerText = e.code.replace('Key','').replace('Space','Espace');
                activeKeyToBind = null;
                e.preventDefault();
                return;
            }
            keys[e.code] = true;
            if(e.code === userKeys.ULTI) triggerUltimate();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function listenNewKey(action) {
            activeKeyToBind = action;
            document.getElementById('kb-' + action).innerText = "...TOUCHE...";
        }

        // --- GESTION DES ONGLETS DU MENU ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('t-' + tabId).classList.add('active');
            document.getElementById('content-' + tabId).classList.add('active');
        }

        // --- SELECTION ET DESCRIPTIONS DES CLASSES ---
        const classes = [
            { name: "GUERRIER", cd: 220, dmg: 10, speed: 3.4, bulletSpeed: 8, spec: "Assaut: Tir Ultra Rapide en Ulti" },
            { name: "SNIPER", cd: 600, dmg: 25, speed: 2.8, bulletSpeed: 14, spec: "Laser: Énorme dégât lourd perforant" },
            { name: "TANK", cd: 450, dmg: 10, speed: 2.5, bulletSpeed: 7.5, spec: "Pompe: 3 projectiles + Bouclier bonus" }
        ];
        let myClassIdx = 0;

        function selectClass(idx) {
            myClassIdx = idx;
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('cb-' + idx).classList.add('active');
            updateSkinPreview();
        }

        // Mini animation loop pour l'aperçu du skin dans le menu
        const previewCanvas = document.getElementById('skin-preview-canvas');
        const pCtx = previewCanvas.getContext('2d');
        let previewFrame = 0;
        function updateSkinPreview() {
            pCtx.fillStyle = "#0b0b10"; pCtx.fillRect(0,0,80,80);
            let bobbing = Math.sin(previewFrame * 0.1) * 3;
            let cx = 40, cy = 40 + bobbing, size = 18;

            let color = myClassIdx === 0 ? '#3871e0' : (myClassIdx === 1 ? '#e67e22' : '#2ecc71');
            pCtx.fillStyle = color; pCtx.fillRect(cx - size, cy - size, size*2, size*2);
            pCtx.fillStyle = '#000'; pCtx.lineWidth = 3; pCtx.strokeRect(cx - size, cy - size, size*2, size*2);

            pCtx.fillStyle = '#111';
            if(myClassIdx === 0) pCtx.fillRect(cx-size, cy-size, size*2, 6); // Bandeau
            if(myClassIdx === 1) pCtx.fillRect(cx-size, cy-4, size*2, 6); // Visière Sniper
            if(myClassIdx === 2) { pCtx.fillRect(cx-size, cy-size, 6, size*2); pCtx.fillRect(cx+size-6, cy-size, 6, size*2); } // Épaulières

            pCtx.fillStyle = '#fff'; pCtx.fillRect(cx+4, cy-2, 4, 4); pCtx.fillRect(cx+12, cy-2, 4, 4); // Yeux
            document.getElementById('class-desc').innerText = classes[myClassIdx].spec;
        }
        setInterval(() => { previewFrame++; updateSkinPreview(); }, 40);

        // --- SYSTEME DE 5 LOBBIES PRIVÉS ---
        let selectedLobbySlot = 0;
        function chooseLobbySlot(num) {
            selectedLobbySlot = num;
            document.querySelectorAll('.lobby-row').forEach(r => r.classList.remove('selected'));
            document.getElementById('lr-' + num).classList.add('selected');
            document.getElementById('lobby-title-action').innerText = "OPTIONS DU SALON " + String(num).padStart(2, '0');
            document.getElementById('lobby-action-zone').style.display = 'block';
        }

        function initLobbyAction(hostMode) {
            let secretCode = document.getElementById('secret-code-input').value.trim();
            if(!secretCode) { document.getElementById('status-text').innerText = "ENTREZ UN CODE SECRET !"; return; }
            
            let finalLobbyStringId = `pixel-arena-lobby-${selectedLobbySlot}-${secretCode}`;
            document.getElementById('status-text').innerText = "Connexion au réseau...";

            if (hostMode) {
                isHost = true; localPlayer = p1; remotePlayer = p2; localPlayer.classIdx = myClassIdx;
                peer = new Peer(finalLobbyStringId);
                peer.on('open', () => { document.getElementById('status-text').innerText = "Salon ouvert ! En attente de ton pote..."; });
                peer.on('error', err => { document.getElementById('status-text').innerText = "Erreur: Code déjà utilisé dans ce salon !"; });
                
                peer.on('connection', connection => {
                    conn = connection;
                    conn.on('data', data => {
                        if (data.type === 'READY') {
                            let rIdx = Math.floor(Math.random() * maps.length); currentMap = maps[rIdx];
                            conn.send({ type: 'START', mapIndex: rIdx, hostClass: myClassIdx }); setupGame();
                        } else handleTraffic(data);
                    });
                });
            } else {
                isHost = false; localPlayer = p2; remotePlayer = p1; localPlayer.classIdx = myClassIdx;
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(finalLobbyStringId);
                    conn.on('open', () => conn.send({ type: 'READY' }));
                    conn.on('data', data => {
                        if (data.type === 'START') { 
                            currentMap = maps[data.mapIndex]; remotePlayer.classIdx = data.hostClass;
                            conn.send({ type: 'GUEST_CLASS', guestClass: myClassIdx }); setupGame(); 
                        } else handleTraffic(data);
                    });
                });
                peer.on('error', err => { document.getElementById('status-text').innerText = "Salon introuvable. Vérifie le numéro et code !"; });
            }
        }

        // --- MAPS ET JEU ---
        const maps = [
            { name: "TEMPLE BRICK", bg: '#1a1c2c', floorColor: '#24273a', obstacles: [{x:180, y:80, w:40, h:290, type:'brick'}, {x:580, y:80, w:40, h:290, type:'brick'}, {x:360, y:195, w:80, h:60, type:'iron'}], decor: [{x:100,y:100,t:1}, {x:700,y:350,t:1}] },
            { name: "HANGAR LUXE", bg: '#1c120c', floorColor: '#2d1e15', obstacles: [{x:340, y:125, w:120, h:200, type:'crate'}, {x:100, y:60, w:80, h:40, type:'crate'}, {x:620, y:350, w:80, h:40, type:'crate'}], decor: [{x:250,y:300,t:2}] },
            { name: "JUNGLE BLOCS", bg: '#132415', floorColor: '#1d3620', obstacles: [{x:160, y:80, w:60, h:60, type:'bush'}, {x:160, y:310, w:60, h:60, type:'bush'}, {x:580, y:80, w:60, h:60, type:'bush'}], decor: [{x:390,y:200,t:1}] }
        ];
        let currentMap = maps[0];

        let p1 = { x: 90, y: 225, size: 15, dx: 1, dy: 0, hp: 100, shield: 0, ulti: 0, classIdx: 0, dashing: 0, ultiActive: 0 };
        let p2 = { x: 710, y: 225, size: 15, dx: -1, dy: 0, hp: 100, shield: 0, ulti: 0, classIdx: 0, dashing: 0, ultiActive: 0 };
        let localPlayer, remotePlayer, bullets = [], items = [], particles = [], gameOver = false, lastShot = 0, lastDash = 0;
        const dashCooldown = 1500;

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').style.display = 'flex';
        }

        // Joystick Mobile Réglé
        let joyActive = false, joyStart = { x: 0, y: 0 }, joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), maxRadius = 26;
        joyZone.addEventListener('touchstart', e => { joyActive = true; const rect = joyZone.getBoundingClientRect(); joyStart = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; });
        window.addEventListener('touchmove', e => {
            if (!joyActive) return; const touch = Array.from(e.touches).find(t => t.target === joyZone || joyZone.contains(t.target)); if (!touch) return;
            let distX = touch.clientX - joyStart.x, distY = touch.clientY - joyStart.y; let dist = Math.hypot(distX, distY);
            if (dist > maxRadius) { distX = (distX / dist) * maxRadius; distY = (distY / dist) * maxRadius; dist = maxRadius; }
            joyStick.style.transform = `translate(${distX}px, ${distY}px)`;
            if (dist > 6) { localPlayer.dx = distX / dist; localPlayer.dy = distY / dist; localPlayer.isMovingTouch = true; }
        });
        window.addEventListener('touchend', () => { joyActive = false; joyStick.style.transform = 'translate(0px, 0px)'; if(localPlayer) localPlayer.isMovingTouch = false; });

        document.getElementById('btn-shoot').addEventListener('touchstart', () => { window.isActionShooting = true; });
        document.getElementById('btn-shoot').addEventListener('touchend', () => { window.isActionShooting = false; });
        document.getElementById('btn-dash').addEventListener('touchstart', () => { triggerDash(); });
        document.getElementById('btn-ulti').addEventListener('touchstart', () => { triggerUltimate(); });

        function handleTraffic(data) {
            if (data.type === 'GUEST_CLASS') { remotePlayer.classIdx = data.guestClass; }
            else if (data.type === 'SYNC') {
                remotePlayer.x = data.x; remotePlayer.y = data.y; remotePlayer.dx = data.dx; remotePlayer.dy = data.dy;
                remotePlayer.hp = data.hp; remotePlayer.shield = data.shield; remotePlayer.ulti = data.ulti;
                remotePlayer.dashing = data.dashing; remotePlayer.ultiActive = data.ultiActive; updateHPBars();
            } else if (data.type === 'SHOOT') {
                bullets.push({ x: data.x, y: data.y, vx: data.vx, vy: data.vy, owner: 'remote', dmg: data.dmg });
            } else if (data.type === 'ITEM') { items = data.items; }
            else if (data.type === 'HIT') { createParticles(data.x, data.y, '#e03838'); }
        }

        function setupGame() {
            document.getElementById('setup-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('local-title').innerText = "TOI (" + classes[localPlayer.classIdx].name + ")";
            document.getElementById('remote-title').innerText = "ENNEMI (" + classes[remotePlayer.classIdx].name + ")";
            document.getElementById('role-indicator').innerText = currentMap.name;
            updateHPBars();
            if (isHost) {
                setInterval(() => {
                    if (gameOver || items.length >= 2) return;
                    let rx = Math.random() * 660 + 70, ry = Math.random() * 310 + 70;
                    if (!checkCollision(rx, ry, 15)) { 
                        items.push({ x: rx, y: ry, itemType: Math.random() > 0.5 ? 'heal' : 'shield' });
                        conn.send({ type: 'ITEM', items: items }); 
                    }
                }, 5000);
            }
            gameLoop();
        }

        function checkCollision(x, y, size) {
            for (let obs of currentMap.obstacles) { if (x + size > obs.x && x - size < obs.x + obs.w && y + size > obs.y && y - size < obs.y + obs.h) return true; }
            return false;
        }

        function triggerDash() {
            const now = Date.now();
            if (now - lastDash > dashCooldown && !localPlayer.dashing) { localPlayer.dashing = 7; lastDash = now; }
        }

        function triggerUltimate() {
            if (localPlayer.ulti >= 100 && localPlayer.ultiActive === 0) {
                localPlayer.ulti = 0; localPlayer.ultiActive = 150;
                if (localPlayer.classIdx === 2) localPlayer.shield = Math.min(100, localPlayer.shield + 40);
                updateHPBars();
            }
        }

        function updateLocalPlayer() {
            let myData = classes[localPlayer.classIdx];
            let mx = 0, my = 0, speed = myData.speed;
            
            if(localPlayer.ulti < 100) localPlayer.ulti += 0.06;

            if (localPlayer.ultiActive > 0) {
                localPlayer.ultiActive--;
                if (localPlayer.classIdx === 0) speed *= 1.6;
            }

            if (localPlayer.dashing > 0) { speed = 8.5; localPlayer.dashing--; }
            
            if (keys[userKeys.UP] || keys['ArrowUp']) my = -1;
            if (keys[userKeys.DOWN] || keys['ArrowDown']) my = 1;
            if (keys[userKeys.LEFT] || keys['ArrowLeft']) mx = -1;
            if (keys[userKeys.RIGHT] || keys['ArrowRight']) mx = 1;
            if (keys[userKeys.DASH]) triggerDash();

            if (mx !== 0 || my !== 0) { localPlayer.dx = mx; localPlayer.dy = my; localPlayer.isMovingTouch = false; }
            let fx = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dx : mx;
            let fy = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dy : my;

            localPlayer.x += fx * speed;
            if (localPlayer.x - localPlayer.size < 0 || localPlayer.x + localPlayer.size > canvas.width || checkCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.x -= fx * speed;
            localPlayer.y += fy * speed;
            if (localPlayer.y - localPlayer.size < 0 || localPlayer.y + localPlayer.size > canvas.height || checkCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.y -= fy * speed;

            if (keys[userKeys.SHOOT] || window.isActionShooting) {
                const now = Date.now();
                let currentCD = myData.cd;
                if (localPlayer.classIdx === 0 && localPlayer.ultiActive > 0) currentCD = 80;

                if (now - lastShot > currentCD) {
                    let baseDmg = myData.dmg;
                    if (localPlayer.classIdx === 1 && localPlayer.ultiActive > 0) baseDmg = 50;

                    if (localPlayer.classIdx === 2) {
                        let angles = [-0.2, 0, 0.2];
                        angles.forEach(ang => {
                            let vx = (localPlayer.dx * Math.cos(ang) - localPlayer.dy * Math.sin(ang)) * myData.bulletSpeed;
                            let vy = (localPlayer.dx * Math.sin(ang) + localPlayer.dy * Math.cos(ang)) * myData.bulletSpeed;
                            let bData = { x: localPlayer.x, y: localPlayer.y, vx: vx, vy: vy, dmg: baseDmg };
                            bullets.push({ ...bData, owner: 'local' }); conn.send({ type: 'SHOOT', ...bData });
                        });
                    } else {
                        let bData = { x: localPlayer.x, y: localPlayer.y, vx: localPlayer.dx * myData.bulletSpeed, vy: localPlayer.dy * myData.bulletSpeed, dmg: baseDmg };
                        bullets.push({ ...bData, owner: 'local' }); conn.send({ type: 'SHOOT', ...bData });
                    }
                    lastShot = now;
                }
            }
            conn.send({ type: 'SYNC', x: localPlayer.x, y: localPlayer.y, dx: localPlayer.dx, dy: localPlayer.dy, hp: localPlayer.hp, shield: localPlayer.shield, ulti: localPlayer.ulti, dashing: localPlayer.dashing, ultiActive: localPlayer.ultiActive });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<6; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, size: Math.random()*2+2, alpha: 1, color: color });
        }

        function update() {
            if (gameOver) return; updateLocalPlayer();
            particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.05; if(p.alpha <= 0) particles.splice(idx, 1); });

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkCollision(b.x, b.y, 4)) { bullets.splice(i, 1); continue; }
                
                if (b.owner === 'remote' && Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) < localPlayer.size) {
                    let totalDmg = b.dmg || 10;
                    if (localPlayer.shield > 0) {
                        localPlayer.shield -= totalDmg; if (localPlayer.shield < 0) { localPlayer.hp += localPlayer.shield; localPlayer.shield = 0; }
                    } else { localPlayer.hp = Math.max(0, localPlayer.hp - totalDmg); }
                    createParticles(b.x, b.y, '#3871e0'); conn.send({ type: 'HIT', x: b.x, y: b.y }); bullets.splice(i, 1); updateHPBars();
                    if (localPlayer.hp <= 0) endGame("DEFAITE... K.O. 💀");
                }
            }
            for (let i = items.length - 1; i >= 0; i--) {
                if (Math.hypot(localPlayer.x - items[i].x, localPlayer.y - items[i].y) < localPlayer.size + 10) {
                    if (items[i].itemType === 'shield') localPlayer.shield = Math.min(100, localPlayer.shield + 30);
                    else localPlayer.hp = Math.min(100, localPlayer.hp + 25);
                    updateHPBars(); items.splice(i, 1); if(isHost) conn.send({ type: 'ITEM', items: items });
                }
            }
            if (remotePlayer.hp <= 0) endGame("VICTOIRE ! 🏆");
        }

        function updateHPBars() {
            document.getElementById('hp-local').style.width = Math.max(0, localPlayer.hp) + '%';
            document.getElementById('shield-local').style.width = Math.max(0, localPlayer.shield) + '%';
            document.getElementById('ulti-local').style.width = Math.min(100, localPlayer.ulti) + '%';
            document.getElementById('hp-remote').style.width = Math.max(0, remotePlayer.hp) + '%';
            document.getElementById('shield-remote').style.width = Math.max(0, remotePlayer.shield) + '%';
            document.getElementById('ulti-remote').style.width = Math.min(100, remotePlayer.ulti) + '%';
        }

        function draw() {
            ctx.fillStyle = currentMap.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = currentMap.floorColor;
            for(let x=0; x<canvas.width; x+=40) { for(let y=0; y<canvas.height; y+=40) { if((x+y)%80===0) ctx.fillRect(x, y, 38, 38); } }

            // Obstacles
            currentMap.obstacles.forEach(obs => {
                if (obs.type === 'brick') {
                    ctx.fillStyle = '#6b3c3c'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#4a2525'; for(let yy = obs.y + 8; yy < obs.y + obs.h; yy += 12) ctx.fillRect(obs.x, yy, obs.w, 3);
                } else if (obs.type === 'crate') {
                    ctx.fillStyle = '#a06030'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = '#503010'; ctx.lineWidth = 3; ctx.strokeRect(obs.x+3, obs.y+3, obs.w-6, obs.h-6);
                } else {
                    ctx.fillStyle = '#737385'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Items
            items.forEach(item => {
                ctx.fillStyle = item.itemType === 'shield' ? '#f1c40f' : '#2ecc71';
                ctx.fillRect(item.x-8, item.y-8, 16, 16);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(item.x-8, item.y-8, 16, 16);
            });

            bullets.forEach(b => {
                ctx.fillStyle = b.owner === 'local' ? '#3871e0' : '#e03838'; ctx.fillRect(b.x-4, b.y-4, 8, 8);
            });

            particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });

            drawPixelPlayer(localPlayer, '#3871e0', '#1d3b75');
            drawPixelPlayer(remotePlayer, '#e03838', '#751d1d');
        }

        function drawPixelPlayer(p, mainColor, darkColor) {
            if (p.hp <= 0) return;
            if(p.ultiActive > 0) { ctx.fillStyle = 'rgba(155, 89, 182, 0.4)'; ctx.fillRect(p.x-p.size-6, p.y-p.size-6, p.size*2+12, p.size*2+12); }
            if(p.dashing > 0) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(p.x-p.size-3, p.y-p.size-3, p.size*2+6, p.size*2+6); }

            ctx.fillStyle = p.classIdx === 0 ? '#3871e0' : (p.classIdx === 1 ? '#e67e22' : '#2ecc71');
            ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
            
            ctx.fillStyle = '#111';
            if (p.classIdx === 1) ctx.fillRect(p.x - p.size, p.y - 4, p.size * 2, 6);
            else if (p.classIdx === 2) { ctx.fillRect(p.x - p.size, p.y - p.size, 5, p.size * 2); ctx.fillRect(p.x + p.size - 5, p.y - p.size, 5, p.size * 2); }
            else ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, 5);

            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);

            ctx.fillStyle = '#fff'; let ex = p.x + p.dx * 6, ey = p.y + p.dy * 6;
            ctx.fillRect(ex - 4, ey - 2, 3, 3); ctx.fillRect(ex + 1, ey - 2, 3, 3);
            
            if(p.shield > 0) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(p.x - p.size - 4, p.y - p.size - 4, p.size * 2 + 8, p.size * 2 + 8); }
        }

        function endGame(text) { gameOver = true; document.getElementById('winnerText').innerText = text; document.getElementById('winnerScreen').style.display = 'flex'; }
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        
        // Init preview par défaut
        updateSkinPreview();
    </script>
</body>
