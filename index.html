<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arène Multi-joueurs (2 Appareils)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a202c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .menu-container {
            text-align: center;
            background: #2d3748;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #4a5568;
        }

        .connection-box {
            margin-bottom: 20px;
            padding: 15px;
            background: #1a202c;
            border-radius: 8px;
            border: 1px solid #4a5568;
        }

        input {
            padding: 10px;
            font-size: 1rem;
            width: 220px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: #2d3748;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2b6cb0; }

        /* Zone de jeu masquée au début */
        #game-zone { display: none; text-align: center; }

        canvas {
            background-color: #2d3748;
            border: 4px solid #4a5568;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
        }

        .hp-bar-container {
            width: 250px;
            background-color: #4a5568;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid #718096;
        }

        .hp-bar { height: 20px; width: 100%; transition: width 0.1s ease; }
        #hp-p1 { background-color: #3182ce; }
        #hp-p2 { background-color: #e53e3e; }

        .winner-screen {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            top: 0; left: 0; width: 100%; height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .winner-text { font-size: 3rem; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="setup-zone" class="menu-container">
        <h1>Arène En Ligne 🌐</h1>
        <div class="connection-box">
            <p><strong>Étape 1 :</strong> Envoie ce code à ton ami :</p>
            <h2 id="my-id" style="color: #63b3ed;">Génération du code...</h2>
        </div>
        <div class="connection-box">
            <p><strong>Étape 2 :</strong> Ou colle le code de ton ami :</p>
            <input type="text" id="friend-id-input" placeholder="Coller le code ici">
            <button onclick="connectToFriend()">Rejoindre la partie</button>
        </div>
    </div>

    <div id="game-zone">
        <div id="ui">
            <div>
                <div id="name-p1" style="font-weight: bold; color: #63b3ed;">Joueur Bleu (P1)</div>
                <div class="hp-bar-container"><div id="hp-p1" class="hp-bar"></div></div>
            </div>
            <div id="role-indicator" style="font-size: 1.2rem; align-self: center; color: #a0aec0;">Connexion réussie !</div>
            <div>
                <div id="name-p2" style="font-weight: bold; color: #fc8181;">Joueur Rouge (P2)</div>
                <div class="hp-bar-container"><div id="hp-p2" class="hp-bar"></div></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div class="winner-screen" id="winnerScreen">
        <div class="winner-text" id="winnerText">Fin de la partie</div>
        <button onclick="location.reload()">Recommencer une connexion</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Réseau PeerJS
        let peer = new Peer();
        let conn = null;
        let isHost = false; // Le créateur est l'hôte (Bleu), le rejoignant est l'invité (Rouge)

        // Gestion du clavier
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Données du jeu
        const obstacles = [
            { x: 200, y: 150, w: 40, h: 200 },
            { x: 560, y: 150, w: 40, h: 200 },
            { x: 350, y: 220, w: 100, h: 60 }
        ];

        let p1 = { x: 80, y: 250, size: 24, color: '#3182ce', dx: 1, dy: 0, hp: 100 };
        let p2 = { x: 720, y: 250, size: 24, color: '#e53e3e', dx: -1, dy: 0, hp: 100 };
        
        let localPlayer, remotePlayer;
        let bullets = [];
        let items = [];
        let gameOver = false;
        let lastShot = 0;
        const shotCooldown = 300; // ms

        // --- GESTION DU RÉSEAU (PEERJS) ---

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // Cas 1 : Quelqu'un se connecte à moi (Je suis l'Hôte - P1 Bleu)
        peer.on('connection', (connection) => {
            conn = connection;
            isHost = true;
            localPlayer = p1;
            remotePlayer = p2;
            setupGame();
        });

        // Cas 2 : Je me connecte à quelqu'un (Je suis l'Invité - P2 Rouge)
        function connectToFriend() {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if(!friendId) return alert("Code invalide");
            
            conn = peer.connect(friendId);
            isHost = false;
            localPlayer = p2;
            remotePlayer = p1;

            conn.on('open', () => {
                setupGame();
            });
        }

        function setupGame() {
            document.getElementById('setup-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('role-indicator').innerText = isHost ? "Tu es BLEU 🔵" : "Tu es ROUGE 🔴";
            
            if(isHost) {
                document.getElementById('name-p1').innerText = "Joueur Bleu (TOI)";
            } else {
                document.getElementById('name-p2').innerText = "Joueur Rouge (TOI)";
            }

            // Écoute des données reçues de l'autre joueur
            conn.on('data', (data) => {
                if (data.type === 'SYNC') {
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                    remotePlayer.dx = data.dx;
                    remotePlayer.dy = data.dy;
                    remotePlayer.hp = data.hp;
                    updateHPBars();
                } 
                else if (data.type === 'SHOOT') {
                    bullets.push({ x: data.x, y: data.y, vx: data.vx, vy: data.vy, color: data.color, owner: 'remote' });
                }
                else if (data.type === 'ITEM_SPAWN') {
                    items.push({ x: data.x, y: data.y, size: 12, id: data.id });
                }
                else if (data.type === 'ITEM_PICK') {
                    items = items.filter(item => item.id !== data.id);
                }
            });

            // Lancement de la boucle de jeu
            gameLoop();

            // L'Hôte gère l'apparition des bonus médicaux toutes les 7 secondes
            if (isHost) {
                setInterval(() => {
                    if (gameOver || items.length >= 2) return;
                    let itemX, itemY;
                    do {
                        itemX = Math.random() * (canvas.width - 60) + 30;
                        itemY = Math.random() * (canvas.height - 60) + 30;
                    } while (checkObstacleCollision(itemX, itemY, 15));

                    let itemId = Date.now();
                    items.push({ x: itemX, y: itemY, size: 12, id: itemId });
                    
                    // On envoie le bonus généré à l'invité
                    conn.send({ type: 'ITEM_SPAWN', x: itemX, y: itemY, id: itemId });
                }, 7000);
            }
        }

        // --- MÉCANIQUES DE JEU ---

        function checkObstacleCollision(x, y, size) {
            for (let obs of obstacles) {
                if (x + size > obs.x && x - size < obs.x + obs.w &&
                    y + size > obs.y && y - size < obs.y + obs.h) {
                    return true;
                }
            }
            return false;
        }

        function updateLocalPlayer() {
            let moveX = 0;
            let moveY = 0;
            let speed = 4;

            // Supporte ZQSD, WASD et les Flèches directionnelles pour le joueur local
            if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) moveY = -1;
            if (keys['KeyS'] || keys['ArrowDown']) moveY = 1;
            if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) moveX = -1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

            if (moveX !== 0 || moveY !== 0) {
                localPlayer.dx = moveX;
                localPlayer.dy = moveY;
            }

            // Déplacement X + Collision
            localPlayer.x += moveX * speed;
            if (localPlayer.x - localPlayer.size < 0 || localPlayer.x + localPlayer.size > canvas.width || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) {
                localPlayer.x -= moveX * speed;
            }

            // Déplacement Y + Collision
            localPlayer.y += moveY * speed;
            if (localPlayer.y - localPlayer.size < 0 || localPlayer.y + localPlayer.size > canvas.height || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) {
                localPlayer.y -= moveY * speed;
            }

            // Gestion du tir local
            if (keys['Space'] || keys['Enter']) {
                const now = Date.now();
                if (now - lastShot > shotCooldown) {
                    let bSpeed = 7;
                    let bulletData = {
                        x: localPlayer.x,
                        y: localPlayer.y,
                        vx: localPlayer.dx * bSpeed,
                        vy: localPlayer.dy * bSpeed,
                        color: localPlayer.color
                    };

                    bullets.push({ ...bulletData, owner: 'local' });
                    lastShot = now;

                    // Envoyer le tir à l'autre joueur
                    conn.send({ type: 'SHOOT', ...bulletData });
                }
            }

            // Envoyer notre position et vie en continu à l'adversaire
            conn.send({
                type: 'SYNC',
                x: localPlayer.x,
                y: localPlayer.y,
                dx: localPlayer.dx,
                dy: localPlayer.dy,
                hp: localPlayer.hp
            });
        }

        function checkVisualCollision(obj1, obj2, dist) {
            let dx = obj1.x - obj2.x;
            let dy = obj1.y - obj2.y;
            return Math.sqrt(dx*dx + dy*dy) < dist;
        }

        function update() {
            if (gameOver) return;

            updateLocalPlayer();

            // Mise à jour des projectiles
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Destruction si mur ou bord touché
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkObstacleCollision(b.x, b.y, 4)) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Si une balle ADVERSAIRE touche notre personnage local
                if (b.owner === 'remote' && checkVisualCollision(b, localPlayer, localPlayer.size)) {
                    localPlayer.hp -= 10;
                    bullets.splice(i, 1);
                    updateHPBars();
                    
                    if (localPlayer.hp <= 0) {
                        endGame("Dommage... Tu as perdu ! ❌");
                    }
                    continue;
                }
            }

            // Gestion de la collecte des Bonus de vie
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (checkVisualCollision(localPlayer, item, localPlayer.size + item.size)) {
                    localPlayer.hp = Math.min(100, localPlayer.hp + 25);
                    updateHPBars();
                    
                    // Notifier l'autre que le bonus a disparu
                    conn.send({ type: 'ITEM_PICK', id: item.id });
                    items.splice(i, 1);
                }
            }

            // Vérifier si l'adversaire est mort
            if (remotePlayer.hp <= 0) {
                endGame("Victoire ! Tu as gagné ! 🏆");
            }
        }

        function updateHPBars() {
            document.getElementById('hp-p1').style.width = Math.max(0, p1.hp) + '%';
            document.getElementById('hp-p2').style.width = Math.max(0, p2.hp) + '%';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obstacles
            ctx.fillStyle = '#4a5568';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = '#718096';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            }

            // Soins
            for (let item of items) {
                ctx.fillStyle = '#38a169';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(item.x - 2, item.y - 7, 4, 14);
                ctx.fillRect(item.x - 7, item.y - 2, 14, 4);
            }

            // Balles
            for (let b of bullets) {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Personnages
            drawCharacter(p1);
            drawCharacter(p2);
        }

        function drawCharacter(p) {
            if (p.hp <= 0) return;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            // Regard
            let eyeX = p.x + p.dx * 8;
            let eyeY = p.y + p.dy * 8;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(eyeX, eyeY, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function endGame(text) {
            gameOver = true;
            document.getElementById('winnerText').innerText = text;
            document.getElementById('winnerScreen').style.display = 'flex';
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
