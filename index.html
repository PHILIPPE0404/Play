<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Arena - Multi-joueurs</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; image-rendering: pixelated; }
        
        /* Suppression totale des barres de défilement */
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Press Start 2P', monospace; background-color: #0b0b10; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none;
        }

        /* Menu de connexion Pixel */
        .menu-container {
            text-align: center; background: #181824; padding: 25px;
            border: 6px solid #fff; box-shadow: 8px 8px 0 #000;
            width: 360px; max-width: 95%;
        }
        h1 { margin-top: 0; color: #3871e0; font-size: 1rem; line-height: 1.4; text-transform: uppercase; }
        .connection-box { margin-bottom: 15px; padding: 12px; background: #242436; border: 4px solid #4d4d6a; }
        p { font-size: 0.6rem; line-height: 1.5; }
        input {
            padding: 10px; font-size: 0.7rem; width: 100%; border: 4px solid #4d4d6a;
            background: #0b0b10; color: white; text-align: center; margin-bottom: 10px;
            font-family: 'Press Start 2P', monospace;
        }
        input:focus { border-color: #3871e0; outline: none; }
        button {
            padding: 12px; font-size: 0.7rem; background: #3871e0; color: #fff;
            border: 4px solid #fff; box-shadow: 4px 4px 0 #1d3b75; cursor: pointer;
            font-family: 'Press Start 2P', monospace; width: 100%; font-weight: bold;
        }
        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1d3b75; }

        /* Interface du jeu */
        #game-zone { display: none; width: 100%; max-width: 800px; padding: 5px; position: relative; }
        #ui {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
            background: #181824; padding: 10px; border: 4px solid #fff;
        }
        .hp-container { display: flex; flex-direction: column; gap: 4px; }
        .hp-bar-container { width: 140px; background-color: #4d4d6a; border: 3px solid #000; height: 18px; }
        .hp-bar { height: 100%; width: 100%; transition: width 0.1s; }
        
        /* Brawl Stars Style: Toi toujours Bleu, l'autre toujours Rouge */
        .local-bar { background: #3871e0; }
        .remote-bar { background: #e03838; }
        #role-indicator { font-size: 0.5rem; color: #f4b41b; text-align: center; }

        .canvas-container { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 6px solid #fff; box-shadow: 6px 6px 0 #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* Contrôles tactiles Mobile */
        #mobile-controls { display: none; position: absolute; bottom: 15px; left: 0; width: 100%; padding: 0 20px; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
        .joystick-zone { width: 90px; height: 90px; background: rgba(0,0,0,0.4); border: 4px solid rgba(255,255,255,0.4); position: relative; pointer-events: auto; }
        .joystick-stick { width: 36px; height: 36px; background: #3871e0; border: 3px solid #fff; position: absolute; top: 23px; left: 23px; }
        .action-buttons { display: flex; gap: 10px; pointer-events: auto; }
        .action-btn { width: 55px; height: 55px; border: 4px solid #fff; color: white; font-size: 0.5rem; display: flex; align-items: center; justify-content: center; background: #181824; box-shadow: 3px 3px 0 #000; }
        #btn-shoot { background: #3871e0; } #btn-dash { background: #e0a938; }

        /* Écran de fin */
        .winner-screen { display: none; position: absolute; background: rgba(11, 11, 16, 0.95); top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .winner-text { font-size: 1.2rem; margin-bottom: 25px; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="setup-zone" class="menu-container">
        <h1>PIXEL ARENA 🌐</h1>
        <div class="connection-box">
            <p style="margin:0 0 8px 0; color:#aaa;">CODE À DONNER :</p>
            <h2 id="my-id" style="color:#3871e0; margin:0; font-size:0.7rem; word-break:break-all;">CHARGEMENT...</h2>
        </div>
        <div class="connection-box">
            <p style="margin:0 0 8px 0; color:#aaa;">REJOINDRE UN AMI :</p>
            <input type="text" id="friend-id-input" placeholder="COLLER LE CODE">
            <button onclick="connectToFriend()">COMBAT !</button>
        </div>
    </div>

    <div id="game-zone">
        <div id="ui">
            <div class="hp-container">
                <div style="font-size:0.5rem; color:#3871e0;">TOI (BLEU)</div>
                <div class="hp-bar-container"><div id="hp-local" class="hp-bar local-bar"></div></div>
            </div>
            <div id="role-indicator">CHARGEMENT MAP...</div>
            <div class="hp-container" style="align-items: flex-end;">
                <div style="font-size:0.5rem; color:#e03838;">ENNEMI (ROUGE)</div>
                <div class="hp-bar-container"><div id="hp-remote" class="hp-bar remote-bar"></div></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
            <div class="winner-screen" id="winnerScreen">
                <div class="winner-text" id="winnerText">FIN</div>
                <button onclick="location.reload()" style="width:auto; padding: 10px 20px;">REJOUER</button>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="joystick-zone" id="joyZone"><div class="joystick-stick" id="joyStick"></div></div>
            <div class="action-buttons">
                <div class="action-btn" id="btn-dash">DASH</div>
                <div class="action-btn" id="btn-shoot">FEU</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Force le rendu Pixel précis

        let peer = new Peer(), conn = null, isHost = false;
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('mobile-controls').style.display = 'flex';
        }

        // --- BANQUE DE 5 MAPS PIXEL UNIQUE ---
        const maps = [
            { name: "LES PILIERS", obstacles: [{x:180, y:80, w:40, h:290}, {x:580, y:80, w:40, h:290}, {x:360, y:195, w:80, h:60}], bg: '#1a1c2c', obsColor: '#3c242c', floorColor: '#24273a' },
            { name: "CENTRE CRUCIAL", obstacles: [{x:340, y:125, w:120, h:200}, {x:100, y:60, w:80, h:40}, {x:620, y:350, w:80, h:40}], bg: '#121216', obsColor: '#2c3e50', floorColor: '#1a1a24' },
            { name: "LES 4 BLOCS", obstacles: [{x:160, y:80, w:60, h:60}, {x:160, y:310, w:60, h:60}, {x:580, y:80, w:60, h:60}, {x:580, y:310, w:60, h:60}], bg: '#1f2e2e', obsColor: '#4d6666', floorColor: '#293d3d' },
            { name: "LABYRINTHE H", obstacles: [{x:120, y:120, w:220, h:30}, {x:460, y:300, w:220, h:30}, {x:380, y:60, w:40, h:120}, {x:380, y:270, w:40, h:120}], bg: '#2d3a22', obsColor: '#1e2714', floorColor: '#354328' },
            { name: "LIGNES CROISÉES", obstacles: [{x:250, y:0, w:40, h:160}, {x:510, y:290, w:40, h:160}, {x:250, y:290, w:40, h:160}, {x:510, y:0, w:40, h:160}], bg: '#2b1b3d', obsColor: '#4a154b', floorColor: '#34224a' }
        ];
        let currentMap = maps[0];

        // Joueurs logiques (p1=Hôte, p2=Invité)
        let p1 = { x: 90, y: 225, size: 16, dx: 1, dy: 0, hp: 100, dashing: 0 };
        let p2 = { x: 710, y: 225, size: 16, dx: -1, dy: 0, hp: 100, dashing: 0 };
        let localPlayer, remotePlayer, bullets = [], items = [], particles = [], gameOver = false, lastShot = 0, lastDash = 0;
        
        // Correction Bug PV : 10 dégâts propres pour éviter les résidus à 1 PV
        const dmgValue = 10, shotCooldown = 250, dashCooldown = 1500;

        // Joystick Mobile
        let joyActive = false, joyStart = { x: 0, y: 0 }, joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), maxRadius = 30;
        joyZone.addEventListener('touchstart', e => { joyActive = true; const rect = joyZone.getBoundingClientRect(); joyStart = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; });
        window.addEventListener('touchmove', e => {
            if (!joyActive) return; const touch = Array.from(e.touches).find(t => t.target === joyZone || joyZone.contains(t.target)); if (!touch) return;
            let distX = touch.clientX - joyStart.x, distY = touch.clientY - joyStart.y; let dist = Math.hypot(distX, distY);
            if (dist > maxRadius) { distX = (distX / dist) * maxRadius; distY = (distY / dist) * maxRadius; dist = maxRadius; }
            joyStick.style.transform = `translate(${distX}px, ${distY}px)`;
            if (dist > 8) { localPlayer.dx = distX / dist; localPlayer.dy = distY / dist; localPlayer.isMovingTouch = true; }
        });
        window.addEventListener('touchend', () => { joyActive = false; joyStick.style.transform = 'translate(0px, 0px)'; if(localPlayer) localPlayer.isMovingTouch = false; });

        document.getElementById('btn-shoot').addEventListener('touchstart', () => { window.isActionShooting = true; });
        document.getElementById('btn-shoot').addEventListener('touchend', () => { window.isActionShooting = false; });
        document.getElementById('btn-dash').addEventListener('touchstart', () => { triggerDash(); });

        // --- RESEAU & SYNCHRONISATION MAP ---
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        
        // L'Hôte reçoit une connexion
        peer.on('connection', connection => {
            conn = connection; isHost = true; localPlayer = p1; remotePlayer = p2;
            
            // Échange initial robuste pour s'accorder sur la même MAP choisie au hasard
            conn.on('data', data => {
                if (data.type === 'READY_TO_JOIN') {
                    let mapIndex = Math.floor(Math.random() * maps.length);
                    currentMap = maps[mapIndex];
                    conn.send({ type: 'MAP_SELECT', index: mapIndex });
                    setupGame();
                } else { handleGameTraffic(data); }
            });
        });
        
        // L'Invité initie la connexion
        function connectToFriend() {
            const fId = document.getElementById('friend-id-input').value.trim(); if(!fId) return;
            conn = peer.connect(fId); isHost = false; localPlayer = p2; remotePlayer = p1;
            
            conn.on('open', () => {
                conn.send({ type: 'READY_TO_JOIN' }); // Demande la map à l'hôte
            });
            conn.on('data', data => {
                if (data.type === 'MAP_SELECT') {
                    currentMap = maps[data.index];
                    setupGame();
                } else { handleGameTraffic(data); }
            });
        }

        function handleGameTraffic(data) {
            if (data.type === 'SYNC') {
                remotePlayer.x = data.x; remotePlayer.y = data.y; remotePlayer.dx = data.dx; remotePlayer.dy = data.dy; remotePlayer.hp = data.hp; remotePlayer.dashing = data.dashing; updateHPBars();
            } else if (data.type === 'SHOOT') {
                bullets.push({ x: data.x, y: data.y, vx: data.vx, vy: data.vy, owner: 'remote' });
            } else if (data.type === 'ITEM') { items = data.items; }
            else if (data.type === 'HIT') { createParticles(data.x, data.y, '#e03838'); }
        }

        function setupGame() {
            document.getElementById('setup-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('role-indicator').innerText = "MAP : " + currentMap.name;
            updateHPBars();

            if (isHost) {
                setInterval(() => {
                    if (gameOver || items.length >= 1) return;
                    let rx = Math.random() * 700 + 50, ry = Math.random() * 350 + 50;
                    if (!checkObstacleCollision(rx, ry, 15)) { items.push({ x: rx, y: ry }); conn.send({ type: 'ITEM', items: items }); }
                }, 7000);
            }
            gameLoop();
        }

        // --- MECANIQUES DE JEU ---
        function checkObstacleCollision(x, y, size) {
            for (let obs of currentMap.obstacles) { if (x + size > obs.x && x - size < obs.x + obs.w && y + size > obs.y && y - size < obs.y + obs.h) return true; }
            return false;
        }

        function triggerDash() {
            const now = Date.now();
            if (now - lastDash > dashCooldown && !localPlayer.dashing) { localPlayer.dashing = 8; lastDash = now; }
        }

        function updateLocalPlayer() {
            let mx = 0, my = 0, currentSpeed = 3.2;
            if (localPlayer.dashing > 0) { currentSpeed = 9; localPlayer.dashing--; }
            
            if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp']) my = -1;
            if (keys['KeyS'] || keys['ArrowDown']) my = 1;
            if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft']) mx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
            if (keys['ShiftLeft'] || keys['ShiftRight']) triggerDash();

            if (mx !== 0 || my !== 0) { localPlayer.dx = mx; localPlayer.dy = my; localPlayer.isMovingTouch = false; }
            let fx = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dx : mx;
            let fy = (('ontouchstart' in window) && localPlayer.isMovingTouch) ? localPlayer.dy : my;

            localPlayer.x += fx * currentSpeed;
            if (localPlayer.x - localPlayer.size < 0 || localPlayer.x + localPlayer.size > canvas.width || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.x -= fx * currentSpeed;
            localPlayer.y += fy * currentSpeed;
            if (localPlayer.y - localPlayer.size < 0 || localPlayer.y + localPlayer.size > canvas.height || checkObstacleCollision(localPlayer.x, localPlayer.y, localPlayer.size)) localPlayer.y -= fy * currentSpeed;

            if (keys['Space'] || keys['Enter'] || window.isActionShooting) {
                const now = Date.now();
                if (now - lastShot > shotCooldown) {
                    let bData = { x: localPlayer.x, y: localPlayer.y, vx: localPlayer.dx * 7.5, vy: localPlayer.dy * 7.5 };
                    bullets.push({ ...bData, owner: 'local' }); lastShot = now; conn.send({ type: 'SHOOT', ...bData });
                }
            }
            conn.send({ type: 'SYNC', x: localPlayer.x, y: localPlayer.y, dx: localPlayer.dx, dy: localPlayer.dy, hp: localPlayer.hp, dashing: localPlayer.dashing });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, size: Math.random()*3+2, alpha: 1, color: color });
        }

        function update() {
            if (gameOver) return; updateLocalPlayer();
            particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.05; if(p.alpha <= 0) particles.splice(idx, 1); });

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkObstacleCollision(b.x, b.y, 4)) { bullets.splice(i, 1); continue; }
                
                if (b.owner === 'remote' && Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) < localPlayer.size) {
                    localPlayer.hp = Math.max(0, localPlayer.hp - dmgValue); // Dégâts propres cleans
                    createParticles(b.x, b.y, '#3871e0');
                    conn.send({ type: 'HIT', x: b.x, y: b.y }); bullets.splice(i, 1); updateHPBars();
                    if (localPlayer.hp <= 0) endGame("DEFAITE... K.O. 💀");
                }
            }
            for (let i = items.length - 1; i >= 0; i--) {
                if (Math.hypot(localPlayer.x - items[i].x, localPlayer.y - items[i].y) < localPlayer.size + 10) {
                    localPlayer.hp = Math.min(100, localPlayer.hp + 20); updateHPBars(); items.splice(i, 1);
                    if(isHost) conn.send({ type: 'ITEM', items: items });
                }
            }
            if (remotePlayer.hp <= 0) endGame("VICTOIRE ! 🏆");
        }

        function updateHPBars() {
            document.getElementById('hp-local').style.width = Math.max(0, localPlayer.hp) + '%';
            document.getElementById('hp-remote').style.width = Math.max(0, remotePlayer.hp) + '%';
        }

        // --- VISUELS STYLE PIXEL ART BRUT ---
        function draw() {
            ctx.fillStyle = currentMap.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sol quadrillé rétro (Pixel Art Décoration)
            ctx.fillStyle = currentMap.floorColor;
            for(let x=0; x<canvas.width; x+=40) { for(let y=0; y<canvas.height; y+=40) { if((x+y)%80===0) ctx.fillRect(x, y, 4, 4); } }

            // Murs / Obstacles Rectangulaires pleins avec bordure noire
            currentMap.obstacles.forEach(obs => {
                ctx.fillStyle = currentMap.obsColor; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Kit Médical Pixel (Carré vert avec croix blanche)
            items.forEach(item => {
                ctx.fillStyle = '#39ff14'; ctx.fillRect(item.x-8, item.y-8, 16, 16);
                ctx.fillStyle = '#fff'; ctx.fillRect(item.x-2, item.y-6, 4, 12); ctx.fillRect(item.x-6, item.y-2, 12, 4);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(item.x-8, item.y-8, 16, 16);
            });

            // Projectiles en pixel carrés (Bleu ou Rouge)
            bullets.forEach(b => {
                ctx.fillStyle = b.owner === 'local' ? '#3871e0' : '#e03838';
                ctx.fillRect(b.x-4, b.y-4, 8, 8);
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(b.x-4, b.y-4, 8, 8);
            });

            // Éclats de particules pixelisées
            particles.forEach(p => {
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // Dessin des Joueurs en Carrés Pixels
            drawPixelPlayer(localPlayer, '#3871e0'); // Toi : Toujours Bleu
            drawPixelPlayer(remotePlayer, '#e03838'); // L'autre : Toujours Rouge
        }

        function drawPixelPlayer(p, color) {
            if (p.hp <= 0) return;
            
            // Effet fantôme pixelisé si Dash actif
            if(p.dashing > 0) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(p.x-p.size-4, p.y-p.size-4, p.size*2+8, p.size*2+8); }

            // Corps carré
            ctx.fillStyle = color; ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);

            // Viseur Pixel directionnel (petit point noir/blanc à l'avant du carré)
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x + p.dx * 10 - 3, p.y + p.dy * 10 - 3, 6, 6);
            ctx.fillStyle = '#000'; ctx.fillRect(p.x + p.dx * 10 - 1, p.y + p.dy * 10 - 1, 2, 2);
        }

        function endGame(text) { gameOver = true; document.getElementById('winnerText').innerText = text; document.getElementById('winnerScreen').style.display = 'flex'; }
        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    </script>
</body>
</html>
